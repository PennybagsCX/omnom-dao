name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  type-check-lint-test:
    name: Type Check + Lint + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate snapshot data
        run: npm run fetch:snapshot

      - name: Type check
        run: npx tsc --noEmit
        env:
          SNAPSHOT_SHA256: ${{ secrets.SNAPSHOT_SHA256 }}

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run --reporter=verbose
        env:
          SNAPSHOT_SHA256: ${{ secrets.SNAPSHOT_SHA256 }}

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate snapshot data
        run: npm run fetch:snapshot

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --reporter=line
        env:
          CI: true
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SNAPSHOT_SHA256: ${{ secrets.SNAPSHOT_SHA256 }}

      # Traces (recorded on retries), per-failure page snapshots and the HTML
      # report — without this, CI failures are undebuggable: the runner's page
      # state at failure time is otherwise lost.
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
