<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIWE Flow Test</title>
    <style>
        body {
            font-family: monospace;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        .test-section {
            background: #2a2a2a;
            border: 1px solid #444;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .test-title {
            color: #FFD700;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .test-result {
            margin: 5px 0;
            padding: 5px;
            border-radius: 3px;
        }
        .pass {
            background: #1e3a1e;
            color: #90EE90;
            border-left: 3px solid #90EE90;
        }
        .fail {
            background: #3a1e1e;
            color: #FF6B6B;
            border-left: 3px solid #FF6B6B;
        }
        .info {
            background: #1e2a3a;
            color: #87CEEB;
            border-left: 3px solid #87CEEB;
        }
        button {
            background: #FFD700;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #FFC700;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        pre {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
            font-size: 12px;
        }
        .mock-wallet-status {
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .active {
            background: #1e3a1e;
            border: 1px solid #90EE90;
        }
        .inactive {
            background: #3a1e1e;
            border: 1px solid #FF6B6B;
        }
    </style>
</head>
<body>
    <h1>🧪 SIWE Flow Comprehensive Test Suite</h1>
    
    <div class="test-section">
        <div class="test-title">🔧 Mock Wallet Status</div>
        <div id="mockWalletStatus" class="mock-wallet-status inactive">Checking...</div>
    </div>

    <div class="test-section">
        <div class="test-title">🚀 Test Controls</div>
        <button onclick="runAllTests()">Run All Tests</button>
        <button onclick="testMockWalletInstallation()">Test Mock Wallet Install</button>
        <button onclick="testSiweMessageCreation()">Test SIWE Message Creation</button>
        <button onclick="testSignatureGeneration()">Test Signature Generation</button>
        <button onclick="testServerVerification()">Test Server Verification</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>

    <div id="results"></div>

    <script type="module">
        // Mock wallet test data
        const MOCK_WALLET_DATA = {
            whale: {
                address: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266",
                privateKey: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80",
                displayName: "Test Whale 🐋"
            },
            dolphin: {
                address: "0x70997970C51812dc3A010C7d01b50e0d17dc79C8",
                privateKey: "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d", 
                displayName: "Test Dolphin 🐬"
            }
        };

        let testResults = [];

        function addResult(testName, status, message, details = null) {
            const result = { test: testName, status, message, details, timestamp: new Date().toISOString() };
            testResults.push(result);
            displayResults();
        }

        function displayResults() {
            const container = document.getElementById('results');
            container.innerHTML = testResults.map(result => `
                <div class="test-section">
                    <div class="test-title">${result.test}</div>
                    <div class="test-result ${result.status}">
                        <strong>${result.status.toUpperCase()}:</strong> ${result.message}
                    </div>
                    ${result.details ? `<pre>${JSON.stringify(result.details, null, 2)}</pre>` : ''}
                    <small style="color: #888;">${result.timestamp}</small>
                </div>
            `).join('');
        }

        function clearResults() {
            testResults = [];
            document.getElementById('results').innerHTML = '';
        }

        async function checkMockWalletStatus() {
            const statusDiv = document.getElementById('mockWalletStatus');
            
            // Check for alternative mock wallet
            const hasAltMock = typeof window.__enhancedMockWallet === 'object';
            
            // Check for standard ethereum mock
            const hasEthMock = window.ethereum?.__isEnhancedMock === true;
            
            // Check for real wallet
            const hasRealWallet = window.ethereum && !hasEthMock;
            
            let statusHTML = '';
            
            if (hasAltMock) {
                statusHTML += `<div>✅ Alternative Mock Wallet: ACTIVE (${window.__enhancedMockWallet?.selectedAddress || 'No address'})</div>`;
            } else {
                statusHTML += `<div>❌ Alternative Mock Wallet: INACTIVE</div>`;
            }
            
            if (hasEthMock) {
                statusHTML += `<div>✅ Standard Ethereum Mock: ACTIVE (${window.ethereum?.selectedAddress || 'No address'})</div>`;
            } else if (hasRealWallet) {
                statusHTML += `<div>⚠️ Real Wallet Extension: DETECTED (MetaMask, etc.)</div>`;
            } else {
                statusHTML += `<div>❌ Standard Ethereum Mock: INACTIVE</div>`;
            }
            
            statusDiv.innerHTML = statusHTML;
            statusDiv.className = `mock-wallet-status ${hasAltMock || hasEthMock ? 'active' : 'inactive'}`;
            
            return { hasAltMock, hasEthMock, hasRealWallet };
        }

        async function installMockWallet() {
            try {
                // Create a simple mock wallet
                const mockWallet = {
                    __isEnhancedMock: true,
                    selectedAddress: MOCK_WALLET_DATA.dolphin.address,
                    chainId: "0x7d0",
                    isMetaMask: true,
                    
                    async request({ method, params }) {
                        console.log(`[MockWallet] ${method}`, params);
                        
                        switch (method) {
                            case 'eth_requestAccounts':
                            case 'eth_accounts':
                                return [MOCK_WALLET_DATA.dolphin.address];
                            case 'eth_chainId':
                                return "0x7d0";
                            case 'personal_sign':
                                const [messageHex] = params;
                                const message = messageHex.startsWith('0x') ? 
                                    hexToUtf8(messageHex) : messageHex;
                                
                                // Sign the message (simplified - normally would use private key)
                                const signature = "0x" + Array(130).fill('0').join(''); // Mock signature
                                return signature;
                            default:
                                return null;
                        }
                    },
                    
                    on(event, handler) {
                        console.log(`[MockWallet] Event listener added: ${event}`);
                    },
                    
                    removeListener(event, handler) {
                        console.log(`[MockWallet] Event listener removed: ${event}`);
                    }
                };
                
                // Install to alternative property
                window.__enhancedMockWallet = mockWallet;
                
                return true;
            } catch (error) {
                console.error('Failed to install mock wallet:', error);
                return false;
            }
        }

        function hexToUtf8(hex) {
            const clean = hex.startsWith('0x') ? hex.slice(2) : hex;
            const bytes = new Uint8Array(clean.length / 2);
            for (let i = 0; i < bytes.length; i++) {
                bytes[i] = parseInt(clean.slice(i * 2, i + 2), 16);
            }
            return new TextDecoder().decode(bytes);
        }

        function utf8ToHex(str) {
            const encoder = new TextEncoder();
            const bytes = encoder.encode(str);
            return "0x" + Array.from(bytes)
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        async function testMockWalletInstallation() {
            addResult("Mock Wallet Installation", "info", "Starting mock wallet installation test...");
            
            const beforeStatus = await checkMockWalletStatus();
            
            if (!beforeStatus.hasAltMock) {
                const installed = await installMockWallet();
                
                if (installed) {
                    addResult("Mock Wallet Installation", "pass", "Mock wallet installed successfully", {
                        property: "__enhancedMockWallet",
                        address: window.__enhancedMockWallet.selectedAddress
                    });
                } else {
                    addResult("Mock Wallet Installation", "fail", "Failed to install mock wallet");
                }
            } else {
                addResult("Mock Wallet Installation", "info", "Mock wallet already installed");
            }
            
            await checkMockWalletStatus();
        }

        async function testSiweMessageCreation() {
            addResult("SIWE Message Creation", "info", "Testing SIWE message creation...");
            
            try {
                const address = MOCK_WALLET_DATA.dolphin.address;
                const domain = window.location.hostname;
                const nonce = "test-nonce-" + Date.now();
                const issuedAt = new Date().toISOString();
                const expirationTime = new Date(Date.now() + 5 * 60 * 1000).toISOString();
                
                const statement = "Sign in to $OMNOM DAO to verify your snapshot holdings. This request will not trigger a blockchain transaction or cost any gas fees.";
                
                const message = [
                    `${domain} wants you to sign in with your Ethereum account:`,
                    address,
                    "",
                    statement,
                    "",
                    `URI: ${window.location.origin}`,
                    "Version: 1",
                    "Chain ID: 1",
                    `Nonce: ${nonce}`,
                    `Issued At: ${issuedAt}`,
                    `Expiration Time: ${expirationTime}`,
                ].join("\n");
                
                addResult("SIWE Message Creation", "pass", "SIWE message created successfully", {
                    message,
                    address,
                    domain,
                    nonce,
                    issuedAt,
                    expirationTime
                });
                
                return { message, address, nonce };
            } catch (error) {
                addResult("SIWE Message Creation", "fail", `Failed to create SIWE message: ${error.message}`, {
                    error: error.toString()
                });
                return null;
            }
        }

        async function testSignatureGeneration() {
            addResult("Signature Generation", "info", "Testing signature generation...");
            
            try {
                const siweResult = await testSiweMessageCreation();
                if (!siweResult) {
                    addResult("Signature Generation", "fail", "SIWE message creation failed");
                    return;
                }
                
                const { message, address } = siweResult;
                const messageHex = utf8ToHex(message);
                
                // Test with mock wallet if available
                let signature = null;
                let provider = null;
                
                if (window.__enhancedMockWallet) {
                    provider = window.__enhancedMockWallet;
                } else if (window.ethereum?.__isEnhancedMock) {
                    provider = window.ethereum;
                }
                
                if (provider) {
                    try {
                        signature = await provider.request({
                            method: 'personal_sign',
                            params: [messageHex, address]
                        });
                        
                        addResult("Signature Generation", "pass", "Signature generated successfully", {
                            message: message.substring(0, 100) + "...",
                            messageHex: messageHex.substring(0, 100) + "...",
                            signature,
                            provider: provider === window.__enhancedMockWallet ? "Alternative Mock" : "Standard Mock"
                        });
                        
                        return { signature, message, address };
                    } catch (error) {
                        addResult("Signature Generation", "fail", `Provider request failed: ${error.message}`, {
                            error: error.toString()
                        });
                    }
                } else {
                    addResult("Signature Generation", "fail", "No mock wallet available for signature generation");
                }
            } catch (error) {
                addResult("Signature Generation", "fail", `Test failed: ${error.message}`, {
                    error: error.toString()
                });
            }
            
            return null;
        }

        async function testServerVerification() {
            addResult("Server Verification", "info", "Testing server verification endpoint...");
            
            try {
                const sigResult = await testSignatureGeneration();
                if (!sigResult) {
                    addResult("Server Verification", "fail", "Signature generation failed");
                    return;
                }
                
                const { signature, message, address } = sigResult;
                
                // First get a nonce
                const nonceResponse = await fetch('/api/v1/nonce');
                if (!nonceResponse.ok) {
                    addResult("Server Verification", "fail", `Failed to get nonce: ${nonceResponse.status}`);
                    return;
                }
                
                const { nonce } = await nonceResponse.json();
                
                // Create proper SIWE message with server nonce
                const domain = window.location.hostname;
                const issuedAt = new Date().toISOString();
                const expirationTime = new Date(Date.now() + 5 * 60 * 1000).toISOString();
                const statement = "Sign in to $OMNOM DAO to verify your snapshot holdings. This request will not trigger a blockchain transaction or cost any gas fees.";
                
                const serverMessage = [
                    `${domain} wants you to sign in with your Ethereum account:`,
                    address,
                    "",
                    statement,
                    "",
                    `URI: ${window.location.origin}`,
                    "Version: 1", 
                    "Chain ID: 1",
                    `Nonce: ${nonce}`,
                    `Issued At: ${issuedAt}`,
                    `Expiration Time: ${expirationTime}`,
                ].join("\n");
                
                const messageHex = utf8ToHex(serverMessage);
                
                // Get signature for server message
                let provider = window.__enhancedMockWallet || window.ethereum;
                if (!provider?.__isEnhancedMock) {
                    addResult("Server Verification", "fail", "No mock wallet available");
                    return;
                }
                
                const serverSignature = await provider.request({
                    method: 'personal_sign',
                    params: [messageHex, address]
                });
                
                // Test verification
                const verifyResponse = await fetch('/api/v1/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: serverMessage,
                        signature: serverSignature
                    })
                });
                
                const verifyData = await verifyResponse.json();
                
                if (verifyResponse.ok) {
                    addResult("Server Verification", "pass", "SIWE verification successful", {
                        serverResponse: verifyData,
                        message: serverMessage.substring(0, 100) + "...",
                        signature: serverSignature
                    });
                } else {
                    addResult("Server Verification", "fail", `Verification failed: ${verifyData.error || verifyResponse.status}`, {
                        serverResponse: verifyData,
                        message: serverMessage.substring(0, 100) + "...",
                        signature: serverSignature
                    });
                }
            } catch (error) {
                addResult("Server Verification", "fail", `Test failed: ${error.message}`, {
                    error: error.toString(),
                    stack: error.stack
                });
            }
        }

        async function runAllTests() {
            clearResults();
            addResult("Test Suite", "info", "Starting comprehensive SIWE flow test...");
            
            await checkMockWalletStatus();
            await testMockWalletInstallation();
            await testSiweMessageCreation();
            await testSignatureGeneration();
            await testServerVerification();
            
            addResult("Test Suite", "info", "Test suite completed. Check results above.");
        }

        // Export functions for global access
        window.runAllTests = runAllTests;
        window.testMockWalletInstallation = testMockWalletInstallation;
        window.testSiweMessageCreation = testSiweMessageCreation;
        window.testSignatureGeneration = testSignatureGeneration;
        window.testServerVerification = testServerVerification;
        window.clearResults = clearResults;
        
        // Initial status check
        checkMockWalletStatus();
        
        // Auto-run on page load
        setTimeout(() => {
            console.log("🧪 Auto-running SIWE tests...");
            runAllTests();
        }, 1000);
    </script>
</body>
</html>
